# Sets up new repositories in the organization: master and develop branches, default branch,
# and a pull request with the files in repo-files/.
# Repositories that are already set up are not changed. Logic: scripts/setup-repos.sh.
name: repository-setup

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Only this repository (empty: all repositories)"
        required: false
        default: ""
      dry_run:
        description: "Report what would change, change nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-setup
  cancel-in-progress: false

jobs:
  setup:
    if: github.repository == 'Noosphaira/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get a token for the noosphere-agent App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.NOOSPHERE_AGENT_APP_ID }}
          private-key: ${{ secrets.NOOSPHERE_AGENT_PRIVATE_KEY }}
          # The workflow sets up every repository in the organization, so the token covers all of them.
          owner: Noosphaira # zizmor: ignore[github-app]
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Set up repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: Noosphaira
          REPO: ${{ inputs.repo }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SUMMARY: ${{ github.step_summary }}
        run: bash scripts/setup-repos.sh
